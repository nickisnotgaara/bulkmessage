services:
  tracker:
    build: .
    image: bulkmessage:latest
    container_name: bulkmessage-tracker
    command: ["python", "-m", "bulkmessage.tracker"]
    env_file: .env.docker
    environment:
      - INSIDE_DOCKER=1
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sender:
    image: bulkmessage:latest
    container_name: bulkmessage-sender
    command: ["python", "-m", "bulkmessage.sender"]
    env_file: .env.docker
    environment:
      - INSIDE_DOCKER=1
    volumes:
      - ./data:/app/data
    profiles: ["manual"]
    restart: "no"
    depends_on:
      tracker:
        condition: service_started
